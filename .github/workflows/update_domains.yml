name: Update Domains and IPFS

on:
  push:
    branches: [ main ]  # Se activa al subir a main
  schedule:
    - cron: '0 */6 * * *'  # Cada 6 horas
  workflow_dispatch:      # Permite ejecución manual desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run domain update
        env:
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_API_SECRET: ${{ secrets.PINATA_API_SECRET }}
        run: python run.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ README.md README.es.md logs/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update domains and CID [skip ci]"
          git push
