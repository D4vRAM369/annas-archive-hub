name: Update Domains and IPFS

on:
  push:
    branches: [ main ]  # Se activa al subir a main
  schedule:
    - cron: '0 */12 * * *'  # Cada 12 horas
  workflow_dispatch:      # Permite ejecución manual desde GitHub

permissions:
  contents: write    # Permite al bot hacer push de cambios
  pages: write       # Opcional, por si usas GitHub Pages
  id-token: write    # Opcional

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run domain update
        env:
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_API_SECRET: ${{ secrets.PINATA_API_SECRET }}
        run: python run.py

      - name: Update GitHub repository homepage
        env:
          GH_PAT: ${{ secrets.MY_PAT }}
        run: |
          CID=$(cat data/ipfs_hash.txt)
          NEW_URL="https://gateway.pinata.cloud/ipfs/$CID"
          echo "Intentando actualizar link a: $NEW_URL"
          
          # Ahora usamos el GH_PAT con permisos de Administration
          curl --fail -X PATCH \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }} \
            -d "{\"homepage\":\"$NEW_URL\"}"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Añadimos solo lo necesario: reportes y base de datos
          git add data/ README.md README.es.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update domains and CID [skip ci]"
          git push
